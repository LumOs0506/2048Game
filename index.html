<!DOCTYPE html>
<html>
<head>
    <title>2048</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="container">
        <h1>2048</h1>
        <div class="header">
            <div class="score-container">
                Score: <span id="score">0</span>
            </div>
            <button id="new-game-button">New Game</button>
        </div>
        <div class="game-board">
        </div>
        <p class="instructions">Use your arrow keys to move the tiles. Tiles with the same number merge into one when they touch. Add them up to reach 2048!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
